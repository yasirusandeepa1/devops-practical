apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-practical
  labels:
    app: devops-practical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-practical
  template:
    metadata:
      labels:
        app: devops-practical
    spec:
      containers:
        - name: flask-app
          image: kgysandeepa/devops-practical:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
